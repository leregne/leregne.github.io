<script>
    const payButton = document.getElementById('pay-button');
    const statusDiv = document.getElementById('status-message');

    // Initialisation immédiate du SDK Pi
    if (typeof Pi !== 'undefined') {
        Pi.init({ version: "2.0", sandbox: true });
        console.log("Pi initialisé");
    } else {
        console.error("Pi SDK non disponible");
    }

    // Attendre que tout le DOM soit chargé pour authentifier
    window.addEventListener('load', function() {
        statusDiv.innerText = "Connexion à Pi Network...";
        
        // Petit délai pour être sûr que l'init a pris effet
        setTimeout(function() {
            Pi.authenticate(['username', 'payments'], function(incompletePayments) {
                if (incompletePayments && incompletePayments.length > 0) {
                    console.log("Paiements incomplets", incompletePayments);
                }
            })
            .then(function(auth) {
                statusDiv.className = "status-box success";
                statusDiv.innerHTML = "Connecté : <strong>" + auth.user.username + "</strong>";
                payButton.disabled = false;
                payButton.innerText = "Payer 1 Pi";
            })
            .catch(function(err) {
                statusDiv.className = "status-box error";
                statusDiv.innerText = "Erreur de connexion : " + err.message;
            });
        }, 300);
    });

    // Le reste (gestion du paiement) reste identique...
    payButton.addEventListener('click', function() { ... });
</script>
