<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DriveSafe App - Validation Étape 10 (Améliorée)</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f0f2f5, #e8eaf0);
        }
        .container {
            text-align: center;
            padding: 30px 20px;
            border-radius: 28px;
            background: white;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.1);
            width: 380px;
            max-width: 100%;
            transition: all 0.2s ease;
        }
        h1 {
            margin: 0 0 8px 0;
            color: #1a1a1a;
            font-weight: 700;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .pi-btn {
            background: linear-gradient(135deg, #6200ee, #8a2be2);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            box-shadow: 0 4px 12px rgba(98, 0, 238, 0.25);
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
        }
        .pi-btn:active:not(:disabled) {
            transform: scale(0.97);
        }
        .pi-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(98, 0, 238, 0.35);
        }
        .pi-btn:disabled {
            background: #b0a0c0;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .status-box {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.4;
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
        }
        .info    { background: #e8f0fe; color: #1a73e8; border-left: 4px solid #1a73e8; }
        .success { background: #e6f4ea; color: #137333; border-left: 4px solid #137333; }
        .error   { background: #fce8e6; color: #c5221f; border-left: 4px solid #c5221f; }
        .warning { background: #fff3e0; color: #b45f06; border-left: 4px solid #b45f06; }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #6200ee;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer-note {
            font-size: 11px;
            color: #aaa;
            margin-top: 20px;
        }
        .logout-btn {
            background: none;
            border: none;
            color: #777;
            font-size: 12px;
            text-decoration: underline;
            margin-top: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DriveSafe</h1>
        <p class="subtitle">Validation Réelle — Étape 10 (améliorée)</p>
        
        <button class="pi-btn" id="pay-button" disabled>
            ⚡ Connexion Pi Network...
        </button>
        
        <button id="logout-button" class="logout-btn" style="display: none;">Changer de compte Pi</button>
        
        <div class="status-box info" id="status-message">
            Initialisation du SDK Pi...
        </div>
        <div class="footer-note">Paiement sécurisé via Pi Blockchain</div>
    </div>

    <script>
        // ----- CONFIGURATION -----
        const BACKEND_URL = "https://drivesafe-x7gv.onrender.com";
        const SANDBOX_MODE = true;     // Passer à false pour la production (avec App ID réel)
        const REQUEST_TIMEOUT_MS = 15000; // 15 secondes max pour les appels backend
        
        // ----- ÉLÉMENTS DOM -----
        const payButton = document.getElementById('pay-button');
        const statusDiv = document.getElementById('status-message');
        const logoutBtn = document.getElementById('logout-button');
        
        // ----- ÉTAT LOCAL -----
        let currentPaymentId = null;
        let currentUser = null;          // { username, uid }
        let isProcessing = false;
        let pendingPaymentReprise = false;
        
        // ----- FONCTIONS UTILITAIRES -----
        function setStatus(text, type = "info") {
            statusDiv.className = `status-box ${type}`;
            statusDiv.innerHTML = text;
        }
        
        function showLoading(text) {
            setStatus(`<span class="spinner"></span>${text}`, "info");
        }
        
        function formatErrorMessage(rawError) {
            // Ne pas exposer les détails techniques à l'utilisateur final
            console.error("[DriveSafe]", rawError);
            if (rawError?.message?.includes("network") || rawError?.message?.includes("fetch")) {
                return "⚠️ Problème de connexion. Vérifiez votre réseau.";
            }
            if (rawError?.message?.includes("timeout")) {
                return "⏱️ Le serveur met trop de temps à répondre. Réessayez.";
            }
            return "❌ Une erreur est survenue. Réessayez plus tard.";
        }
        
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        async function fetchWithTimeout(url, options, timeoutMs = REQUEST_TIMEOUT_MS) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') throw new Error('Request timeout');
                throw err;
            }
        }
        
        // ----- APPELS BACKEND AVEC GESTION D'ERREUR -----
        async function approvePaymentOnServer(paymentId) {
            const response = await fetchWithTimeout(`${BACKEND_URL}/approve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentId, userId: currentUser?.uid })
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server approve failed: ${response.status} ${errorText}`);
            }
            return await response.json();
        }
        
        async function completePaymentOnServer(paymentId, txid) {
            const response = await fetchWithTimeout(`${BACKEND_URL}/complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentId, txid, userId: currentUser?.uid })
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server complete failed: ${response.status} ${errorText}`);
            }
            return await response.json();
        }
        
        // ----- GESTION D'UN PAIEMENT INCOMPLET (reprise) -----
        async function resumeIncompletePayment(payment) {
            if (isProcessing) return;
            isProcessing = true;
            pendingPaymentReprise = true;
            setStatus(`🔄 Reprise d'un paiement en attente (ID: ${payment.identifier.substring(0, 8)}...)`, "info");
            payButton.disabled = true;
            
            try {
                // Vérifier l'état : si déjà approuvé par le serveur mais non complété
                // Le SDK Pi propose des méthodes pour avancer, mais ici on va suivre la logique:
                // Si on a un paymentId, on tente de finaliser.
                // attention: Pi.completePayment nécessite paymentId et txid, mais on peut récupérer txid depuis payment.txid
                if (payment.status === 'ready_for_server_completion' && payment.txid) {
                    showLoading("Finalisation du paiement existant...");
                    await completePaymentOnServer(payment.identifier, payment.txid);
                    await window.Pi.completePayment(payment.identifier, payment.txid);
                    setStatus("✅ Paiement antérieur finalisé avec succès ! Étape 10 validée.", "success");
                    payButton.innerText = "✓ Étape validée";
                    payButton.disabled = true;
                } 
                else if (payment.status === 'ready_for_server_approval') {
                    showLoading("Validation serveur en cours (paiement existant)...");
                    await approvePaymentOnServer(payment.identifier);
                    await window.Pi.approvePayment(payment.identifier);
                    // Après approbation, on attend la completion (normalement Pi déclenchera l'étape suivante)
                    setStatus("✅ Paiement approuvé, finalisation automatique...", "success");
                    // On relance pas complete ici car Pi appellera onReadyForServerCompletion
                }
                else {
                    setStatus(`⚠️ Paiement en statut inattendu (${payment.status}). Contactez le support.`, "warning");
                    payButton.disabled = false;
                }
            } catch (err) {
                setStatus(formatErrorMessage(err), "error");
                payButton.disabled = false;
            } finally {
                isProcessing = false;
                pendingPaymentReprise = false;
            }
        }
        
        // ----- CALLBACK GLOBAL POUR PAIEMENTS INCOMPLETS (déclenché par Pi SDK) -----
        function onIncompletePaymentFound(payment) {
            console.log("Paiement incomplet détecté:", payment);
            if (!currentUser) {
                // Pas encore authentifié, on stocke pour plus tard ?
                setStatus("Paiement en attente détecté. Connectez-vous pour le reprendre.", "warning");
                return;
            }
            // Reprendre automatiquement
            resumeIncompletePayment(payment);
        }
        
        // ----- INITIALISATION DU SDK ET AUTHENTIFICATION -----
        async function initPiSDK() {
            try {
                if (!window.Pi) {
                    throw new Error("SDK Pi non chargé - vérifiez votre connexion internet");
                }
                
                showLoading("Initialisation du réseau Pi...");
                
                // Initialiser avec gestion des paiements incomplets
                await window.Pi.init({ 
                    version: "2.0", 
                    sandbox: SANDBOX_MODE,
                    onIncompletePaymentFound: onIncompletePaymentFound   // CLÉ : reprise automatique
                });
                
                setStatus("Authentification en cours...");
                
                // Authentification avec scopes nécessaires
                const auth = await window.Pi.authenticate(['username', 'payments'], (payment) => {
                    // Callback alternative pour paiements incomplets (par sécurité)
                    if (payment && !pendingPaymentReprise) {
                        console.log("Callback d'authentification - paiement trouvé:", payment);
                        onIncompletePaymentFound(payment);
                    }
                });
                
                currentUser = {
                    username: auth.user.username,
                    uid: auth.user.uid
                };
                
                setStatus(`✅ Connecté : <strong>${currentUser.username}</strong>`, "success");
                logoutBtn.style.display = "inline-block";
                
                // Vérifier activement s'il y a des paiements incomplets après login
                try {
                    const pendingPayments = await window.Pi.getPendingPayments();
                    if (pendingPayments && pendingPayments.length > 0) {
                        console.log("Paiements en attente récupérés:", pendingPayments);
                        for (const payment of pendingPayments) {
                            if (payment.status === 'ready_for_server_approval' || payment.status === 'ready_for_server_completion') {
                                await resumeIncompletePayment(payment);
                                break; // Un seul à la fois
                            }
                        }
                    }
                } catch (err) {
                    console.warn("Impossible de récupérer les paiements en attente:", err);
                }
                
                // Préparer le bouton de paiement seulement si aucune reprise en cours
                if (!isProcessing) {
                    payButton.disabled = false;
                    payButton.innerText = "💰 Payer 1 Pi (Validation Étape 10)";
                    payButton.onclick = handlePayment;
                }
                
            } catch (err) {
                console.error(err);
                let userMsg = formatErrorMessage(err);
                if (err.message.includes("authenticate")) userMsg = "Échec de l'authentification Pi. Assurez-vous d'avoir l'application Pi installée et d'être connecté.";
                setStatus(userMsg, "error");
                payButton.disabled = true;
                payButton.innerText = "⚠️ Erreur de connexion";
            }
        }
        
        // ----- CRÉATION D'UN NOUVEAU PAIEMENT -----
        async function handlePayment() {
            if (payButton.disabled || isProcessing) return;
            isProcessing = true;
            payButton.disabled = true;
            showLoading("Préparation du paiement...");
            
            try {
                // Petite vérification backend facultative : on peut tester un endpoint /health
                // Mais on va directement créer le paiement.
                
                await window.Pi.createPayment({
                    amount: 1,
                    memo: "Validation Étape 10 - DriveSafe (sécurisé)",
                    metadata: { 
                        step: "10",
                        app: "DriveSafe",
                        userId: currentUser?.uid,
                        timestamp: Date.now()
                    }
                }, {
                    onReadyForServerApproval: async (paymentId) => {
                        currentPaymentId = paymentId;
                        showLoading("Approbation par le serveur...");
                        try {
                            await approvePaymentOnServer(paymentId);
                            await window.Pi.approvePayment(paymentId);
                        } catch (err) {
                            console.error("Erreur approval serveur:", err);
                            setStatus(formatErrorMessage(err), "error");
                            throw err; // Propagé à onError
                        }
                    },
                    
                    onReadyForServerCompletion: async (paymentId, txid) => {
                        showLoading("Finalisation chez le commerçant...");
                        try {
                            await completePaymentOnServer(paymentId, txid);
                            await window.Pi.completePayment(paymentId, txid);
                            setStatus("🎉 Félicitations ! Étape 10 validée avec succès ! 🎉", "success");
                            payButton.innerText = "✓ Validation réussie";
                            payButton.disabled = true; // Ne plus permettre de nouveau paiement
                        } catch (err) {
                            console.error("Erreur completion serveur:", err);
                            setStatus(formatErrorMessage(err), "error");
                            throw err;
                        }
                    },
                    
                    onCancel: (paymentId) => {
                        console.log("Paiement annulé par l'utilisateur", paymentId);
                        setStatus("Paiement annulé. Vous pouvez réessayer.", "info");
                        payButton.disabled = false;
                        isProcessing = false;
                        currentPaymentId = null;
                    },
                    
                    onError: (error, paymentId) => {
                        console.error("Erreur Pi SDK:", error, paymentId);
                        setStatus(formatErrorMessage(error), "error");
                        payButton.disabled = false;
                        isProcessing = false;
                        currentPaymentId = null;
                    }
                });
                
                // Si on arrive ici sans erreur, c'est que le paiement est en cours ou terminé.
                // On ne réactive pas le bouton immédiatement (car on est dans les callbacks async)
                // mais le callback onError/onCancel le réactivera si besoin.
                // Pour éviter un blocage, on ajoute un gardien : après 30s si jamais ni succès ni erreur, on relâche.
                setTimeout(() => {
                    if (isProcessing === true && !statusDiv.innerText.includes("succès") && !statusDiv.innerText.includes("Erreur")) {
                        console.warn("Timeout global de paiement - réactivation du bouton");
                        setStatus("Le paiement a pris trop de temps. Vérifiez votre application Pi.", "warning");
                        payButton.disabled = false;
                        isProcessing = false;
                    }
                }, 60000);
                
            } catch (err) {
                console.error("Erreur lors de createPayment:", err);
                setStatus(formatErrorMessage(err), "error");
                payButton.disabled = false;
                isProcessing = false;
            }
        }
        
        // ----- DÉCONNEXION (réinitialisation de la session locale) -----
        function logout() {
            if (isProcessing) {
                setStatus("Veuillez attendre la fin du paiement avant de changer de compte.", "warning");
                return;
            }
            currentUser = null;
            currentPaymentId = null;
            setStatus("Déconnecté. Rechargement...", "info");
            payButton.disabled = true;
            payButton.innerText = "⚡ Connexion Pi Network...";
            logoutBtn.style.display = "none";
            // Réinitialiser le SDK? Simple rechargement de la page pour une propreté maximale
            setTimeout(() => {
                window.location.reload();
            }, 800);
        }
        
        // ----- LANCEMENT -----
        window.onload = () => {
            initPiSDK();
            logoutBtn.onclick = logout;
        };
    </script>
</body>
</html>
