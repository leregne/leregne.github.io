<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveSafe App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 320px;
        }
        .pi-btn {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(98, 0, 238, 0.3);
        }
        .status-box {
            margin-top: 20px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .success { background-color: #e6f4ea; color: #137333; display: block; }
    </style>
</head>
<body>

    <div class="container">
        <h1>DriveSafe App</h1>
        <p>Simulation de paiement Sandbox sécurisée</p>
        
        <button class="pi-btn" id="pay-button">Payer 1 Pi</button>
        
        <div class="status-box" id="status-message"></div>
    </div>

    <script>
        // Initialisation directe qui fonctionnait sur ton écran
        window.Pi.init({ version: "2.0", sandbox: true });

        document.getElementById('pay-button').addEventListener('click', function() {
            const statusDiv = document.getElementById('status-message');
            statusDiv.style.display = "none";
            
            window.Pi.createPayment({
                amount: 1,
                memo: "Test Sandbox DriveSafe",
                metadata: { orderId: "DS-2026" }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    // Cette ligne valide immédiatement l'approbation sans alerte bloquante
                    window.Pi.approvePayment(paymentId);
                },
                
                onReadyForServerCompletion: function(paymentId, txid) {
                    // Cette ligne finalise la transaction auprès de la Sandbox
                    window.Pi.completePayment(paymentId);
                    
                    statusDiv.className = "status-box success";
                    statusDiv.innerHTML = "<strong>Succès !</strong><br>Paiement validé.<br>TXID: " + txid.substring(0, 12);
                },
                
                onCancel: function(paymentId) {
                    alert("Paiement annulé.");
                },
                
                onError: function(error, paymentId) {
                    alert("Erreur : " + error.message);
                }
            });
        });
    </script>

</body>
</html>
