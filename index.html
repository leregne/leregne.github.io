<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveSafe App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 320px;
        }
        .pi-btn {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(98, 0, 238, 0.3);
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DriveSafe App</h1>
        <p>Simulation de paiement Sandbox sécurisée</p>
        <button class="pi-btn" id="pay-button">Payer 1 Pi</button>
        <div class="status" id="status-text">Statut : Connexion...</div>
    </div>

    <script>
        // 1. Initialisation basique
        window.Pi.init({ version: "2.0", sandbox: true });

        // 2. Authentification immédiate et silencieuse au chargement
        window.Pi.authenticate(['username', 'payments'], function(incomplete) {
            console.log("Paiement incomplet :", incomplete);
        })
        .then(function(auth) {
            document.getElementById('status-text').innerText = "Connecté en tant que : " + auth.user.username;
        })
        .catch(function(err) {
            document.getElementById('status-text').innerText = "Erreur login : " + err.message;
        });

        // 3. Gestion de l'action de paiement
        document.getElementById('pay-button').addEventListener('click', function() {
            window.Pi.createPayment({
                amount: 1,
                memo: "Test Sandbox DriveSafe",
                metadata: { orderId: "DS-2026" }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    alert("Paiement initié ! ID : " + paymentId);
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    alert("Paiement validé !");
                },
                onCancel: function(paymentId) {
                    alert("Annulé.");
                },
                onError: function(error, paymentId) {
                    alert("Erreur réseau Pi : " + error.message);
                }
            });
        });
    </script>

</body>
</html>
