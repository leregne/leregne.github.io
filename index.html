    <script>
        const Pi = window.Pi;
        const payButton = document.getElementById('pay-button');
        const statusDiv = document.getElementById('status-message');

        // 1. On démarre d'abord le système Pi
        try {
            Pi.init({ version: "2.0", sandbox: true });
            
            // 2. On attend 1 seconde complète pour être SÛR que le SDK est prêt
            setTimeout(function() {
                statusDiv.className = "status-box info";
                statusDiv.innerText = "Authentification auprès de Pi...";
                
                // 3. Maintenant, on peut connecter l'utilisateur en toute sécurité
                Pi.authenticate(['username', 'payments'], function(onIncompletePaymentFound) {
                    console.log("Paiement incomplet :", onIncompletePaymentFound);
                })
                .then(function(auth) {
                    statusDiv.className = "status-box success";
                    statusDiv.innerHTML = "Connecté en tant que : <strong>" + auth.user.username + "</strong>";
                    payButton.disabled = false;
                    payButton.innerText = "Payer 1 Pi";
                })
                .catch(function(error) {
                    statusDiv.className = "status-box error";
                    statusDiv.innerHTML = "Erreur de connexion : " + error.message;
                });
            }, 1000); // Pause de sécurité de 1000 millisecondes
            
        } catch (e) {
            statusDiv.className = "status-box error";
            statusDiv.innerHTML = "Erreur critique : " + e.message;
        }

        // 4. Gestion du clic sur le bouton
        payButton.addEventListener('click', function() {
            payButton.disabled = true;
            payButton.innerText = "Traitement...";
            
            Pi.createPayment({
                amount: 1,
                memo: "Test sécurisé DriveSafe",
                metadata: { orderId: "DS-2026-TEST" }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    alert("Étape 1 : Paiement " + paymentId + " généré. Approbation simulée !");
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    statusDiv.className = "status-box success";
                    statusDiv.innerHTML = "<strong>Succès !</strong><br>Paiement validé.<br>TXID: " + txid.substring(0, 15);
                    payButton.disabled = false;
                    payButton.innerText = "Payer 1 Pi";
                },
                onCancel: function(paymentId) {
                    alert("Paiement annulé.");
                    payButton.disabled = false;
                    payButton.innerText = "Payer 1 Pi";
                },
                onError: function(error, paymentId) {
                    alert("Erreur : " + error.message);
                    payButton.disabled = false;
                    payButton.innerText = "Payer 1 Pi";
                }
            });
        });
    </script>
