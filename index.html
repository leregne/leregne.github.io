<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveSafe App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 320px;
        }
        .pi-btn {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(98, 0, 238, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DriveSafe App</h1>
        <p>Simulation de paiement Sandbox sécurisée</p>
        <button class="pi-btn" id="pay-button">Payer 1 Pi</button>
    </div>

    <script>
        // Initialisation simple
        window.Pi.init({ version: "2.0", sandbox: true });

        document.getElementById('pay-button').addEventListener('click', function() {
            window.Pi.createPayment({
                amount: 1,
                memo: "Test Sandbox DriveSafe",
                metadata: { orderId: "DS-2026" }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    // On affiche juste l'info, sans forcer l'approbation interdite ici
                    alert("Paiement généré avec succès ! ID : " + paymentId);
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    alert("Paiement complété !");
                },
                onCancel: function(paymentId) {
                    alert("Paiement annulé.");
                },
                onError: function(error, paymentId) {
                    alert("Erreur : " + error.message);
                }
            });
        });
    </script>

</body>
</html>
